name: Build and publish DammPulse desktop installers
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/linux-desktop.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Generate red DammPulse desktop icon
        working-directory: desktop
        run: node generate-icons.cjs
      - name: Build Linux AppImage
        working-directory: desktop
        run: npm run dist:linux
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: dammpulse-linux-x64
          path: desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Generate red DammPulse desktop icon
        working-directory: desktop
        run: node generate-icons.cjs
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:windows
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dammpulse-windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: dammpulse-linux-x64
          path: release
      - name: Rename Linux installer
        run: |
          file="$(find release -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$file"
          cp "$file" release/DammPulse-Linux-x64.AppImage
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: dammpulse-windows-x64
          path: release
      - name: Rename Windows installer
        run: |
          file="$(find release -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$file"
          cp "$file" release/DammPulse-Setup.exe
      - name: Rename Windows portable ZIP
        run: |
          file="$(find release -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$file"
          cp "$file" release/DammPulse-Windows-Portable.zip
      - name: Publish permanent downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: DammPulse 1.0.0
          make_latest: true
          files: |
            release/DammPulse-Setup.exe
            release/DammPulse-Windows-Portable.zip
            release/DammPulse-Linux-x64.AppImage
