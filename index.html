<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B8040B">
  <meta name="description" content="DAMM+: plataforma de conocimiento, formación y soporte industrial.">
  <title>DAMM+ | Industrial Knowledge Platform</title>
  <link rel="manifest" href="manifest.webmanifest?v=20261110-damm-plus-brand">
  <link rel="icon" href="icon.svg?v=20261110-damm-plus-brand" type="image/svg+xml">
  <style>
    :root { --bg: #f4f3ed; --damm-red: #b8040b; --damm-yellow: #ffd51f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: #1b1b1b;
    }
    .shell {
      min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #f9f7f2, #efebdf);
    }
    .panel {
      width: min(96vw, 880px); background: #fff; border-radius: 18px; box-shadow: 0 18px 60px rgba(0,0,0,.12);
      padding: 2rem 2rem 1.5rem; border: 1px solid rgba(0,0,0,.06);
    }
    .brand {
      display: flex; align-items: center; gap: 0.5rem; font-weight: 900; letter-spacing: -0.06em;
      font-size: clamp(2rem, 5vw, 4rem); font-family: Georgia, "Times New Roman", serif; color: var(--damm-red);
    }
    .brand .plus { color: var(--damm-yellow); }
    .subtitle { margin-top: 0.75rem; font-size: 1.05rem; color: #3d3d3d; }
    .box { margin-top: 1.5rem; display: grid; gap: 0.7rem; }
    .item { padding: 0.9rem 1rem; background: #f8f7f3; border-radius: 12px; }
    .small { font-size: 0.8rem; text-transform: uppercase; letter-spacing: .08em; color: #666; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div class="brand" aria-label="DAMM+">DAMM<span class="plus">+</span></div>
      <div class="subtitle">Plataforma de conocimiento, formación y soporte industrial.</div>
      <div class="box">
        <div class="item"><span class="small">Brand</span><br> DAMM+</div>
        <div class="item"><span class="small">Status</span><br> Rebranding complete.</div>
      </div>
    </div>
  </div>
</body>
</html>
